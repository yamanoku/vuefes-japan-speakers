name: Vize Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "musea/**"
      - "config/**"
      - "types/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tsconfig.vize.json"
      - ".github/workflows/linter.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Run lint
        run: vp run lint
        env:
          CI: true
