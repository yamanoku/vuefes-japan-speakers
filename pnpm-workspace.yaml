allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

catalogs:
  css:
    "@tailwindcss/vite": 4.3.5
    tailwindcss: 4.3.5
  test:
    "@mizchi/mutator": 0.5.0
    "@mizchi/mutator-playwright": 0.5.0
    "@playwright/test": 1.65.1
    "@vue/test-utils": 2.6.0
    happy-dom: 21.0.4
    playwright: 1.65.1
    vitest: 5.1.1
  typescript:
    "@types/node": 26.6.6
    tsrs: 7.1.0-beta.tsrs3
    typescript: 7.0.2
  vite:
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vue:
    "@vue/server-renderer": 3.5.45
    vue: 3.5.45
  vuerend:
    "@vuerend/core": 1.0.0-rc.2
  musea:
    "@vizejs/vite-plugin-musea": 0.784.0
    axe-core: 4.14.1
    esbuild: 0.28.2
  vize:
    "@vizejs/vite-plugin": 0.784.0
    oxlint: 1.94.0
    oxlint-plugin-vize: 0.784.0
    vize: 0.784.0
  vp:
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
    vite-plus: 1.7.0
    vitest: 5.1.1
    "@vitest/browser-playwright": 5.1.1

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vue: ">=3.5.31"
    vitest: "*"

autoInstallPeers: false

minimumReleaseAgeExclude:
  - "@voidzero-dev/*"
  - vize
  - "@vizejs/*"
  - oxlint
  - oxlint-plugin-vize
  - "@vuerend/*"
  - "@mizchi/*"
  - tsrs
  - "@tsrs/*"
overrides:
  vite@*: catalog:vp
  vitest@*: catalog:vp
